<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BizPulse PRO - Быстрый запуск</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
            max-width: 500px;
            width: 100%;
        }
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }
        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        .button {
            display: block;
            width: 100%;
            padding: 20px;
            margin: 15px 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }
        .button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }
        .button.secondary {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            box-shadow: 0 4px 15px rgba(245, 87, 108, 0.4);
        }
        .button.secondary:hover {
            box-shadow: 0 6px 20px rgba(245, 87, 108, 0.6);
        }
        .status {
            margin-top: 30px;
            padding: 15px;
            background: #f5f5f5;
            border-radius: 10px;
            font-size: 14px;
            color: #666;
        }
        .status-item {
            margin: 10px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #ccc;
            display: inline-block;
        }
        .status-dot.online {
            background: #4caf50;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .info {
            margin-top: 20px;
            font-size: 12px;
            color: #999;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 BizPulse PRO</h1>
        <p class="subtitle">Быстрый запуск</p>
        
        <a href="http://localhost:3000" class="button" target="_blank">
            📊 Открыть Фронтенд
        </a>
        
        <a href="http://localhost:8000/docs" class="button secondary" target="_blank">
            🔧 Открыть API Документацию
        </a>
        
        <div class="status">
            <div class="status-item">
                <span class="status-dot" id="frontend-status"></span>
                <span>Фронтенд: http://localhost:3000</span>
            </div>
            <div class="status-item">
                <span class="status-dot" id="backend-status"></span>
                <span>Бэкенд: http://localhost:8000/docs</span>
            </div>
        </div>
        
        <div class="info">
            Убедитесь что серверы запущены перед открытием!
        </div>
    </div>

    <script>
        // Проверка доступности серверов
        function checkStatus() {
            // Проверка фронтенда
            fetch('http://localhost:3000', { mode: 'no-cors' })
                .then(() => {
                    document.getElementById('frontend-status').classList.add('online');
                })
                .catch(() => {
                    document.getElementById('frontend-status').classList.remove('online');
                });

            // Проверка бэкенда
            fetch('http://localhost:8000/docs', { mode: 'no-cors' })
                .then(() => {
                    document.getElementById('backend-status').classList.add('online');
                })
                .catch(() => {
                    document.getElementById('backend-status').classList.remove('online');
                });
        }

        // Проверяем каждые 3 секунды
        checkStatus();
        setInterval(checkStatus, 3000);
    </script>
</body>
</html>
